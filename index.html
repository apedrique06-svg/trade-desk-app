<div class="frame" id="app">

  <section id="dash">

    <div class="panel balance"><div class="ptitle"><span id="baltitle">BALANCE</span><span id="balpct"></span></div>

    </div>
    <div class="panel"><div class="ptitle"><span>DESK</span><span class="muted" id="tabname"></span></div><nav id="tabs">
  <button data-tab="pos" class="on">Posiciones</button>
  <button data-tab="night">Noche</button>
  <button data-tab="coins">Coins</button>
  <button data-tab="act">Actividad</button>
  <button data-tab="health">Salud</button>
</nav><main id="view"></main></div>
  </section>

  <section id="setup" hidden>

    <button id="save">Guardar</button>
    <p class="muted small" id="setupmsg"></p>
  </section>
